services:
  api:
    build:
      context: .
      dockerfile: src/Api/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - api-data:/app/data
    environment:
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/appointments.db"
      ExternalCalendarApi__BaseUrl: "http://localhost:8080"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    depends_on:
      - api

  # Postgres, commented out for now - flip this on once the Npgsql
  # provider swap is done. See README "Database Strategy" for the
  # documented plan (UseNpgsql swap, EXCLUDE USING gist as an optional
  # enhancement).
